<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thesis Collection · Lab Portal</title>
  <meta name="description" content="An index of theses from the lab. Each entry links out to its own thesis site." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <a class="skip-link" href="#grid">Skip to listings</a>

  <header class="site-header">
    <div class="wrap">
      <div class="header-row">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span class="brand-mark-dot"></span>
            <span class="brand-mark-dot"></span>
            <span class="brand-mark-dot"></span>
            <span class="brand-mark-dot"></span>
          </div>
          <div class="brand-text">
            <h1>Thesis Collection</h1>
            <p class="tagline">An index of theses from the lab. Each card opens its full thesis site.</p>
          </div>
        </div>

        <div class="header-tools">
          <div class="stat-line" id="stat-line" aria-live="polite">
            <span class="stat-skel"></span>
          </div>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle theme">
            <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="4" fill="currentColor"/>
              <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <line x1="12" y1="2.5" x2="12" y2="5"/>
                <line x1="12" y1="19" x2="12" y2="21.5"/>
                <line x1="2.5" y1="12" x2="5" y2="12"/>
                <line x1="19" y1="12" x2="21.5" y2="12"/>
                <line x1="4.9" y1="4.9" x2="6.7" y2="6.7"/>
                <line x1="17.3" y1="17.3" x2="19.1" y2="19.1"/>
                <line x1="4.9" y1="19.1" x2="6.7" y2="17.3"/>
                <line x1="17.3" y1="6.7" x2="19.1" y2="4.9"/>
              </g>
            </svg>
            <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M20 14.5A8 8 0 0 1 9.5 4a.6.6 0 0 0-.84-.66A9.5 9.5 0 1 0 20.66 15.34.6.6 0 0 0 20 14.5Z" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="filters" aria-label="Filter theses">
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <line x1="16" y1="16" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input
          id="q"
          type="search"
          placeholder="Search titles, authors, abstracts, tags…"
          aria-label="Search theses"
          autocomplete="off"
          spellcheck="false"
        />
        <kbd class="kbd-hint" aria-hidden="true">/</kbd>
      </div>

      <div class="facet" role="group" aria-label="Filter by year">
        <span class="facet-label">Year</span>
        <div class="chips" id="year-chips"></div>
      </div>

      <div class="facet facet-tags" role="group" aria-label="Filter by tag">
        <span class="facet-label">Tag</span>
        <div class="chips" id="tag-chips"></div>
      </div>

      <div class="filter-meta">
        <span id="result-count" aria-live="polite"></span>
        <button id="clear-filters" class="link-btn" type="button" hidden>Clear filters</button>
      </div>
    </section>

    <section id="grid" class="grid" aria-busy="true" aria-label="Theses">
      <!-- skeletons render here on first paint, then real cards -->
      <div class="skel-card"></div>
      <div class="skel-card"></div>
      <div class="skel-card"></div>
    </section>

    <section id="empty" class="empty" hidden>
      <h2>No theses match those filters.</h2>
      <p>Try a different query, or <button class="link-btn" type="button" data-clear>clear all filters</button>.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        <span>Maintained as a static index. Each thesis lives at its own URL.</span>
        <span class="dot">·</span>
        <a href="#" rel="noopener">Submission guide</a>
        <span class="dot">·</span>
        <a href="#" rel="noopener">RSS</a>
      </p>
    </div>
  </footer>

  <script src="./assets/app.js"></script>
</body>
</html>
